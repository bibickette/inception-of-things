apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels: {{- include "gitlab.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}

spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "gitlab.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gitlab.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
          - name: GITLAB_OMNIBUS_CONFIG
            value: |
              nginx['listen_https'] = false
              nginx['listen_adresses'] = ['0.0.0.0']
          startupProbe:
            exec:
              command:
              - curl
              - localhost/-/health
              - --fail-with-body
            periodSeconds: 5
            failureThreshold: 60
      