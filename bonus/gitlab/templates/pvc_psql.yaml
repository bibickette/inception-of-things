
apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-volume-psql
  labels:
    type: volume-psql
spec:
  storageClassName: shared-storage
  capacity: 
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  hostPath:
    path: {{ .Values.persistence.hostMountDataPath }}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.existingDataClaim }}
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: shared-storage
  accessModes:
    - ReadWriteMany
  selector:
    matchLabels:
        type: volume-psql
  resources:
    requests:
      storage: {{ .Values.persistence.size }}