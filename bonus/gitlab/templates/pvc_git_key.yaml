apiVersion: v1
kind: PersistentVolume
metadata:
  name: shared-volume-git-key
  labels:
    type: volume-git-key
spec:
  storageClassName: shared-storage
  capacity: 
    storage: {{ .Values.persistence.size }}
  accessModes:
    - ReadWriteMany
  volumeMode: Filesystem
  hostPath:
    path: {{ .Values.persistence.hostMountKeyPath }}

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.persistence.existingKeyClaim }}
  namespace: {{ .Release.Namespace }}
spec:
  storageClassName: shared-storage
  accessModes:
    - ReadWriteMany
  selector:
    matchLabels:
        type: volume-git-key
  resources:
    requests:
      storage: {{ .Values.persistence.size }}

