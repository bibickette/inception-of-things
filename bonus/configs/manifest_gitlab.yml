apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: test
spec:
  destination:
    namespace: test
    server: https://kubernetes.default.svc
  source:
    path: .
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/test.git
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
