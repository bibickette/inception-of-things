apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wil-app-gitlab
  namespace: argocd
spec:
  destination:
    namespace: dev
    server: https://kubernetes.default.svc
  source:
    path: .
    repoURL: http://gitlab.gitlab.svc.cluster.local/root/iot-gcaptari.git
    targetRevision: HEAD
  sources: []
  project: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true
