apiVersion: v1
kind: Service
metadata: 
  name: {{ .Chart.Name }}
  labels:
    {{- include "test.labels" . | nindent 4 }}
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
  selector:
    {{- include "test.selectorLabels" . | nindent 4 }}