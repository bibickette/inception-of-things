apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-iot-ingress
  namespace: demo-iot
spec:
  ingressClassName: traefik
  rules:
    - host: app1.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: first-ever-service
                port:
                  number: 8080
    - host: app2.com
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: second-ever-service
                port:
                  number: 4242
    - http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: three-ever-service
                port:
                  number: 7070
    

